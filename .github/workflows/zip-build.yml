name: Zip'ten Derle
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      - uses: android-actions/setup-android@v3

      - name: Zip'i bul ve çıkar
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Bulunan zip: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          find extracted -maxdepth 3 -type f | head -n 50

      - name: Derle
        run: |
          # settings.gradle.kts'in olduğu klasörü bul
          PROJE=$(find extracted -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "Proje klasörü: $PROJE"
          cd "$PROJE"
          gradle assembleDebug --stacktrace
          find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/ \;

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: Dosya-Yoneticisi-Debug-APK
          path: app-debug.apk
